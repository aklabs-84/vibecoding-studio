<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>선생님 진행 현황 - 바이브코딩 스튜디오</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --line: #2a3349;
    --text: #e8edf7;
    --muted: #93a0ba;
    --go: #34d399;       /* 진행 중 */
    --done: #60a5fa;     /* 완료 */
    --warn: #fbbf24;     /* 신호 없음 */
    --off: #64748b;      /* 접속 전 */
    --bad: #f87171;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 18px; line-height: 1.5; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }

  /* 입장 화면 */
  #gate { max-width: 460px; margin: 12vh auto 0; }
  #gate h1 { margin-bottom: 8px; }
  #gate p { margin: 0 0 22px; color: var(--muted); }
  .field { display: block; margin-bottom: 16px; }
  .field span { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--panel); border: 2px solid var(--line); color: var(--text); font: inherit; padding: 14px 14px; border-radius: 4px; }
  .field input:focus { outline: none; border-color: var(--done); }
  .btn { background: var(--done); color: #0b1220; border: 0; font: inherit; font-weight: 800; padding: 14px 20px; border-radius: 4px; cursor: pointer; width: 100%; transition: transform .12s, filter .12s; }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: wait; transform: none; }
  .err { color: var(--bad); min-height: 1.5em; margin-top: 12px; font-size: .95rem; }

  /* 상단 */
  #board { display: none; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .live { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .dot { width: 10px; height: 10px; background: var(--go); display: inline-block; }
  .dot.bad { background: var(--bad); }
  .dot.beat { animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: .25; } }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; text-decoration: underline; cursor: pointer; padding: 0; }
  .linkbtn:hover { color: var(--text); }

  /* 요약 숫자 */
  .sum { display: flex; gap: 0; border: 1px solid var(--line); margin-bottom: 18px; }
  .sum > div { flex: 1; padding: 14px 18px; border-right: 1px solid var(--line); }
  .sum > div:last-child { border-right: 0; }
  .sum b { display: block; font-size: 2.2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sum span { font-size: .9rem; color: var(--muted); }
  .sum .s-go b { color: var(--go); } .sum .s-done b { color: var(--done); }
  .sum .s-warn b { color: var(--warn); } .sum .s-off b { color: var(--off); }

  /* 단계별 인원 */
  .stagebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); margin-bottom: 18px; }
  .stagebar > div { padding: 10px 14px; border-right: 1px solid var(--line); }
  .stagebar > div:last-child { border-right: 0; }
  .stagebar b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stagebar span { display: block; font-size: .85rem; color: var(--muted); }

  .tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .tools .lbl { color: var(--muted); font-size: .9rem; margin-right: 4px; }
  .seg { background: transparent; border: 1px solid var(--line); color: var(--muted); font: inherit; font-size: .9rem; padding: 6px 14px; cursor: pointer; transition: color .12s, border-color .12s; }
  .seg:hover { color: var(--text); border-color: var(--muted); }
  .seg.on { color: var(--text); border-color: var(--done); border-bottom-width: 3px; }

  /* 학생 목록 */
  .team { margin-top: 18px; }
  .team h2 { font-size: 1rem; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; color: var(--text); }
  .team h2 span { color: var(--muted); font-weight: 400; font-size: .9rem; }
  .row { display: grid; grid-template-columns: 150px 1fr 110px 120px; align-items: center; gap: 14px; padding: 10px 8px; border-bottom: 1px solid var(--line); transition: background .15s; }
  .row:hover { background: var(--panel); }
  .row.flash { animation: flash 3s ease-out; }
  @keyframes flash { 0% { background: rgba(52,211,153,.28); } 100% { background: transparent; } }
  .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .where { min-width: 0; }
  .where .pages { display: flex; gap: 4px; margin-bottom: 4px; }
  .pip { flex: 1; height: 8px; background: var(--line); position: relative; }
  .pip.done { background: var(--done); }
  .pip.cur { background: var(--go); }
  .pip.cur.stale { background: var(--warn); }
  .pip.cur::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; background: var(--bg); opacity: .0; }
  .where .txt { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-weight: 800; font-size: .95rem; }
  .state.go { color: var(--go); } .state.done { color: var(--done); } .state.warn { color: var(--warn); } .state.off { color: var(--off); }
  .seen { color: var(--muted); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; }
  .legend { margin-top: 28px; color: var(--muted); font-size: .85rem; line-height: 1.8; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }

  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr 1fr; }
    .where { grid-column: 1 / -1; order: 3; }
    .sum { flex-wrap: wrap; } .sum > div { flex: 1 1 45%; }
    .stagebar { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="gate">
    <h1>선생님 진행 현황</h1>
    <p>학생들이 지금 어느 단계에 있는지 실시간으로 볼 수 있어요.</p>
    <label class="field"><span>클래스 입장 코드</span><input id="inCode" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label class="field"><span>선생님 비밀번호</span><input id="inKey" type="password" autocomplete="off"></label>
    <button class="btn" id="enterBtn" type="button">현황 보기</button>
    <div class="err" id="gateErr" role="alert"></div>
  </section>

  <section id="board">
    <div class="top">
      <div>
        <h1>진행 현황 <span class="muted" id="codeLbl" style="font-size:1rem;font-weight:400"></span></h1>
        <div class="live"><span class="dot beat" id="liveDot"></span><span id="liveTxt">연결 중…</span></div>
      </div>
      <button class="linkbtn" id="exitBtn" type="button">나가기</button>
    </div>

    <div class="sum" id="sum"></div>
    <div class="stagebar" id="stagebar"></div>

    <div class="tools">
      <span class="lbl">보기</span>
      <button class="seg on" data-sort="team" type="button">팀별</button>
      <button class="seg" data-sort="name" type="button">이름순</button>
      <button class="seg" data-sort="slow" type="button">도움이 필요한 순</button>
    </div>

    <div id="list"></div>

    <div class="legend">
      막대 4칸 = 0 팀 프로필 · 1 몬스터 스타트업 · 2 기획서 · 3 앱 만들기 (파란색 = 마침, 초록색 = 지금 여기)<br>
      <b>신호 없음</b> = 1분 넘게 소식이 없는 학생 (창을 닫았거나 인터넷이 끊겼을 수 있어요) · 화면은 5초마다 자동으로 새로 고쳐져요
    </div>
  </section>
</div>

<script>
(function () {
  const PAGE_NAMES = ['팀 프로필', '몬스터 스타트업', '기획서', '앱 만들기'];
  const POLL_MS = 5000;
  const STALE_SEC = 60;      // 이 시간 넘게 신호가 없으면 "신호 없음"
  const LEFT_SEC = 10;       // 나간다는 신호 후 이 시간이 지나면 "나감"
  const $ = id => document.getElementById(id);

  let creds = null, sortMode = 'team', timer = null, inflight = false;
  let skew = 0;                         // 서버 시계 - 내 시계 (초). 내 컴퓨터 시계가 틀려도 정확히 계산
  let lastData = [], lastOk = 0, fails = 0;
  const prevKey = new Map();            // 학생별 마지막 위치 (바뀌면 잠깐 반짝)
  const flashUntil = new Map();

  try {
    const c = sessionStorage.getItem('vcs_teacher_creds');
    if (c) { const o = JSON.parse(c); $('inCode').value = o.entryCode || ''; $('inKey').value = o.teacherKey || ''; }
  } catch (e) {}

  async function fetchView() {
    const res = await fetch('/api/progress-view', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(creds),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) {
      const e = new Error((data && data.error) || '불러오지 못했어요');
      e.status = res.status;
      throw e;
    }
    return data;
  }

  async function enter() {
    const entryCode = $('inCode').value.trim();
    const teacherKey = $('inKey').value;
    if (!entryCode || !teacherKey) { $('gateErr').textContent = '입장 코드와 비밀번호를 모두 입력해 주세요.'; return; }
    creds = { entryCode, teacherKey };
    $('enterBtn').disabled = true; $('gateErr').textContent = '';
    try {
      const data = await fetchView();
      try { sessionStorage.setItem('vcs_teacher_creds', JSON.stringify(creds)); } catch (e) {}
      $('gate').style.display = 'none'; $('board').style.display = 'block';
      $('codeLbl').textContent = '· ' + entryCode;
      apply(data);
      schedule();
    } catch (e) {
      $('gateErr').textContent = e.status === 401 ? '비밀번호가 맞지 않아요.' : e.status === 404 ? '입장 코드를 찾을 수 없어요.' : e.message;
    } finally { $('enterBtn').disabled = false; }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(poll, POLL_MS);
  }
  async function poll() {
    if (inflight) return schedule();
    inflight = true;
    try { apply(await fetchView()); fails = 0; }
    catch (e) { fails++; setLive(false, e.status === 401 ? '비밀번호가 바뀌었어요. 나갔다가 다시 들어와 주세요.' : '연결이 불안정해요. 마지막 정상 갱신: ' + clock(lastOk)); }
    finally { inflight = false; schedule(); }
  }
  document.addEventListener('visibilitychange', () => { if (creds && document.visibilityState === 'visible') { clearTimeout(timer); poll(); } });

  function clock(t) { return t ? new Date(t).toLocaleTimeString('ko-KR') : '-'; }
  function setLive(ok, text) {
    $('liveDot').className = 'dot ' + (ok ? 'beat' : 'bad');
    $('liveTxt').textContent = text;
  }

  function nowSec() { return Date.now() / 1000 + skew; }
  function ageOf(s) { return s.last_seen ? nowSec() - Date.parse(s.last_seen) / 1000 : Infinity; }

  // 상태: off(접속 전) / done(끝) / left(나감) / stale(신호 없음) / go(진행 중)
  function statusOf(s) {
    if (!s.started) return 'off';
    if ((s.submitted_pages || []).includes(3)) return 'done';
    const age = ageOf(s);
    if (!s.online && age > LEFT_SEC) return 'left';
    if (age > STALE_SEC) return 'stale';
    return 'go';
  }
  const STATE_TXT = { off: '접속 전', done: '완료', left: '나감', stale: '신호 없음', go: '진행 중' };
  const STATE_CLS = { off: 'off', done: 'done', left: 'warn', stale: 'warn', go: 'go' };

  function apply(data) {
    lastOk = Date.now(); lastData = data.students || [];
    if (data.server_time) skew = Date.parse(data.server_time) / 1000 - Date.now() / 1000;
    render();
    setLive(true, '실시간 · ' + clock(lastOk) + ' 갱신');
  }

  function seenTxt(s) {
    if (!s.started) return '-';
    const a = Math.max(0, Math.round(ageOf(s)));
    if (a < 5) return '방금';
    if (a < 60) return a + '초 전';
    return Math.floor(a / 60) + '분 전';
  }

  function render() {
    const rows = lastData.map(s => Object.assign({ st: statusOf(s) }, s));
    const cnt = k => rows.filter(r => r.st === k).length;
    const trouble = cnt('stale') + cnt('left');

    $('sum').innerHTML = '';
    [['전체', rows.length, ''], ['진행 중', cnt('go'), 's-go'], ['완료', cnt('done'), 's-done'], ['신호 없음·나감', trouble, 's-warn'], ['접속 전', cnt('off'), 's-off']].forEach(a => {
      const d = document.createElement('div'); d.className = a[2];
      const b = document.createElement('b'); b.textContent = a[1];
      const sp = document.createElement('span'); sp.textContent = a[0];
      d.append(b, sp); $('sum').append(d);
    });

    // 단계별 지금 있는 사람 수 (접속 전·완료 제외)
    $('stagebar').innerHTML = '';
    PAGE_NAMES.forEach((n, i) => {
      const c = rows.filter(r => r.started && r.st !== 'done' && r.page === i).length;
      const d = document.createElement('div');
      const b = document.createElement('b'); b.textContent = c + '명';
      const sp = document.createElement('span'); sp.textContent = i + ' ' + n + ' 중';
      d.append(b, sp); $('stagebar').append(d);
    });

    // 위치가 바뀐 학생은 3초간 반짝
    const now = Date.now();
    rows.forEach(r => {
      const key = r.page + ':' + r.step_no + ':' + (r.submitted_pages || []).join();
      if (prevKey.has(r.student_id) && prevKey.get(r.student_id) !== key && r.started) flashUntil.set(r.student_id, now + 3000);
      prevKey.set(r.student_id, key);
    });

    const needHelp = r => ({ stale: 0, left: 1, go: 2, off: 3, done: 4 }[r.st]);
    const byName = (a, b) => a.name.localeCompare(b.name, 'ko');
    let groups;
    if (sortMode === 'team') {
      const m = new Map();
      rows.slice().sort(byName).forEach(r => {
        const k = r.team_name || (r.started ? '팀 이름 없음' : '아직 접속 전');
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(r);
      });
      groups = Array.from(m.entries()).sort((a, b) => {
        const last = x => (x === '아직 접속 전' ? 2 : x === '팀 이름 없음' ? 1 : 0);
        return last(a[0]) - last(b[0]) || a[0].localeCompare(b[0], 'ko', { numeric: true });
      });
    } else if (sortMode === 'slow') {
      groups = [['', rows.slice().sort((a, b) => needHelp(a) - needHelp(b) || (a.page ?? -1) - (b.page ?? -1) || (a.step_no ?? -1) - (b.step_no ?? -1) || byName(a, b))]];
    } else {
      groups = [['', rows.slice().sort(byName)]];
    }

    const list = $('list'); list.innerHTML = '';
    if (!rows.length) { list.innerHTML = '<div class="empty">이 클래스에 등록된 학생이 아직 없어요.</div>'; return; }
    groups.forEach(([title, members]) => {
      const box = document.createElement('div'); box.className = 'team';
      if (title) {
        const h = document.createElement('h2');
        const t = document.createElement('div'); t.textContent = title;
        const n = document.createElement('span');
        n.textContent = members.filter(m => m.st === 'done').length + ' / ' + members.length + '명 완료';
        h.append(t, n); box.append(h);
      }
      members.forEach(r => box.append(rowEl(r, now)));
      list.append(box);
    });
  }

  function rowEl(r, now) {
    const row = document.createElement('div'); row.className = 'row';
    if ((flashUntil.get(r.student_id) || 0) > now) row.classList.add('flash');

    const name = document.createElement('div'); name.className = 'name';
    name.textContent = r.name;
    if (sortMode !== 'team' && r.team_name) { const sm = document.createElement('small'); sm.textContent = r.team_name; name.append(sm); }

    const where = document.createElement('div'); where.className = 'where';
    const pages = document.createElement('div'); pages.className = 'pages';
    const finished = new Set([...(r.completed_pages || []), ...(r.submitted_pages || [])]);
    for (let i = 0; i < 4; i++) {
      const p = document.createElement('div'); p.className = 'pip';
      p.title = i + ' ' + PAGE_NAMES[i] + ((r.submitted_pages || []).includes(i) ? ' · 제출함' : '');
      if (finished.has(i)) p.classList.add('done');
      else if (r.started && r.page === i && r.st !== 'done') { p.classList.add('cur'); if (r.st === 'stale' || r.st === 'left') p.classList.add('stale'); }
      pages.append(p);
    }
    const txt = document.createElement('div'); txt.className = 'txt';
    if (!r.started) txt.textContent = '아직 스튜디오에 들어오지 않았어요';
    else if (r.st === 'done') txt.textContent = '앱 만들기까지 제출 완료';
    else {
      const frac = r.step_total ? ` (${r.step_no}/${r.step_total})` : '';
      txt.textContent = `${r.page} ${r.page_label || PAGE_NAMES[r.page] || ''} · ${r.step_label || ''}${frac}`;
      const subs = (r.submitted_pages || []).filter(p => p !== 3);
      if (subs.length) txt.textContent += ' · 제출: ' + subs.map(p => PAGE_NAMES[p]).join(', ');
    }
    where.append(pages, txt);

    const state = document.createElement('div'); state.className = 'state ' + STATE_CLS[r.st];
    state.textContent = STATE_TXT[r.st];
    const seen = document.createElement('div'); seen.className = 'seen'; seen.textContent = seenTxt(r);
    row.append(name, where, state, seen);
    return row;
  }

  // 마지막 신호 시각은 5초마다 새 데이터가 와야 바뀌므로, 사이사이에도 "몇 초 전"이 자연스럽게 흐르게 한다.
  setInterval(() => { if (creds && lastData.length) render(); }, 1000);

  document.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
    sortMode = b.dataset.sort;
    document.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
    render();
  }));
  $('enterBtn').addEventListener('click', enter);
  ['inCode', 'inKey'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') enter(); }));
  $('exitBtn').addEventListener('click', () => {
    clearTimeout(timer); creds = null; lastData = [];
    try { sessionStorage.removeItem('vcs_teacher_creds'); } catch (e) {}
    $('inKey').value = ''; $('board').style.display = 'none'; $('gate').style.display = 'block';
  });
})();
</script>
</body>
</html>
