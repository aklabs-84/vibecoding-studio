<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-store">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시안 B — 마왕의 계약서</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root {
  --desk: #1a0b2a; --desk2: #2a0845; --paper: #f0e0b8; --paper2: #e3cd97; --ink: #2a1608; --ink2: #6b4a2b;
  --blood: #a3122b; --gold: #c9951c; --green: #00ff41; --light: #f4eeff;
  --px: 'Press Start 2P', monospace; --kr: 'Galmuri11', 'Galmuri9', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--desk); color: var(--light); font-family: var(--kr); font-size: 18px; line-height: 1.75; min-height: 100vh;
  background-image: radial-gradient(circle at 50% 0, #3a1260 0, transparent 60%); }
button { font-family: inherit; cursor: pointer; color: inherit; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 28px; }
.bar .brand { font-family: var(--px); font-size: 13px; color: var(--green); }
.bar .team { color: #b9a8d6; margin-left: 10px; }
.bar .right { display: flex; gap: 18px; align-items: center; }
.reset { background: none; border: none; color: #b9a8d6; text-decoration: underline; font-size: 14px; }
.reset:hover { color: #ff6b81; }

.stage { display: grid; grid-template-columns: 86px minmax(0, 820px); justify-content: center; gap: 0; padding: 10px 20px 70px; }

/* 책갈피 */
.tabs { display: flex; flex-direction: column; gap: 6px; padding-top: 34px; align-items: flex-end; }
.tab { width: 70px; word-break: keep-all; border: none; border-radius: 0; background: var(--desk2); color: #b9a8d6; padding: 12px 6px 12px 10px; text-align: left; font-size: 14px; line-height: 1.3; box-shadow: -4px 0 0 #000 inset; transition: background .15s, color .15s; position: relative; }
.tab .n { font-family: var(--px); font-size: 12px; display: block; margin-bottom: 2px; }
.tab:hover:not(:disabled):not(.on) { background: #3d1568; color: #fff; box-shadow: -4px 0 0 #000 inset, inset 0 -3px 0 var(--blood); }
.tab:disabled { opacity: .3; cursor: not-allowed; }
.tab.done { background: var(--blood); color: #ffe4ea; }
.tab.done:hover:not(:disabled):not(.on) { background: #b3203f; }
.tab.done .n::after { content: ' ✓'; }
.tab.on { width: 82px; background: var(--paper); color: var(--ink); box-shadow: none; }
.tab.on .n { color: var(--blood); }

/* 종이 */
.page { background: var(--paper); color: var(--ink); padding: 40px 54px 36px; position: relative; box-shadow: 0 0 0 4px #000, 10px 10px 0 4px #000, inset 0 0 0 4px var(--paper2);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(107, 74, 43, .08) 31px 32px); }
.page.flip-out { animation: flipOut .35s ease-in forwards; }
.page.flip-in { animation: flipIn .4s ease-out; }
@keyframes flipOut { to { transform: translateX(-40px) rotate(-2deg); opacity: 0; } }
@keyframes flipIn { from { transform: translateX(40px) rotate(2deg); opacity: 0; } to { transform: none; opacity: 1; } }

.chap { font-family: var(--px); font-size: 12px; color: var(--blood); margin-bottom: 10px; }
.title { font-size: 30px; line-height: 1.4; margin-bottom: 8px; }
.mission { color: var(--ink2); font-size: 18px; margin-bottom: 26px; }

/* AIDEN 말풍선 */
.ask { display: grid; grid-template-columns: 62px 1fr; gap: 16px; align-items: start; margin-bottom: 30px; }
.face { width: 62px; height: 62px; background: var(--desk2); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 28px; }
.bubble { background: #fff8e4; border: 3px solid var(--ink); padding: 14px 18px; position: relative; font-size: 19px; line-height: 1.6; }
.bubble::before { content: ''; position: absolute; left: -13px; top: 18px; border: 8px solid transparent; border-right-color: var(--ink); }
.bubble .who { font-family: var(--px); font-size: 10px; color: var(--blood); display: block; margin-bottom: 4px; }
.bubble .row { display: flex; gap: 14px; margin-top: 10px; align-items: center; font-size: 15px; color: var(--ink2); flex-wrap: wrap; }
.bubble .row button { background: none; border: none; border-bottom: 2px solid var(--blood); color: var(--blood); font-size: 15px; padding: 0; transition: transform .1s; }
.bubble .row button:hover { transform: translateY(-2px); }

/* 문장 속 빈칸 */
.contract { font-size: 26px; line-height: 2.1; margin-bottom: 8px; }
.contract .fix { color: var(--ink); }
.blank { display: inline; min-width: 6ch; border-bottom: 4px dotted var(--blood); padding: 0 6px 2px; outline: none; color: var(--blood); background: rgba(163, 18, 43, .06); transition: background .15s; word-break: keep-all; }
.blank:focus { background: rgba(163, 18, 43, .14); border-bottom-style: solid; }
.blank:empty::before { content: attr(data-ph); color: #b9936a; }
.nameline { font-size: 18px; margin-bottom: 8px; color: var(--ink2); }
.nameline .blank { font-size: 24px; }

.hint { font-size: 16px; color: var(--ink2); margin-bottom: 22px; }
.hint b { font-weight: 400; color: var(--blood); }

/* 붙임쪽지 */
.slips-lab { font-size: 16px; color: var(--ink2); margin-bottom: 8px; }
.slips { display: flex; flex-wrap: wrap; gap: 14px 12px; margin-bottom: 14px; padding: 6px 4px 14px; }
.slip { background: #fff3a8; border: none; color: var(--ink); padding: 12px 14px; max-width: 250px; text-align: left; font-size: 15px; line-height: 1.5; box-shadow: 4px 4px 0 rgba(0, 0, 0, .35); transform: rotate(var(--r)); transition: transform .15s, box-shadow .15s; }
.slip:nth-child(2n) { background: #ffd6c9; } .slip:nth-child(3n) { background: #d4f0c0; }
.slip:hover { transform: rotate(0) translateY(-6px); box-shadow: 6px 10px 0 rgba(0, 0, 0, .35); }
.slip.used { outline: 3px solid var(--blood); }
.dicebtn { background: none; border: 3px dashed var(--blood); color: var(--blood); padding: 8px 16px; font-size: 16px; }
.dicebtn:hover { background: var(--blood); color: #fff; }

/* 하단: 저장 + 봉인 */
.foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 30px; padding-top: 22px; border-top: 3px double var(--ink2); flex-wrap: wrap; }
.saved { font-size: 15px; color: var(--ink2); line-height: 1.6; }
.saved b { font-weight: 400; color: #1d7a2e; }
.saved .d { display: inline-block; width: 10px; height: 10px; background: #bbb; margin-right: 8px; }
.saved.ok .d { background: #1d7a2e; }
.saved.pulse .d { animation: pop .5s; }
@keyframes pop { 0% { transform: scale(2.4); } 100% { transform: scale(1); } }
.seals { display: flex; gap: 18px; align-items: center; }
.back { background: none; border: none; color: var(--ink2); text-decoration: underline; font-size: 15px; }
.back:hover { color: var(--ink); }
.wax { width: 108px; height: 108px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 30%, #d4283f 0, var(--blood) 55%, #6e0a1c 100%); color: #ffe4ea; font-size: 18px; line-height: 1.35; box-shadow: 0 6px 0 #4a0613, 0 0 0 4px #000; transition: transform .1s, box-shadow .1s, filter .2s; }
.wax:hover:not(:disabled) { transform: translateY(-3px) rotate(-4deg); box-shadow: 0 10px 0 #4a0613, 0 0 0 4px #000; }
.wax:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #4a0613, 0 0 0 4px #000; }
.wax:disabled { background: #b9a37a; color: #7c6a48; box-shadow: 0 0 0 4px #7c6a48; cursor: not-allowed; }
.turn { background: var(--ink); color: var(--paper); border: none; padding: 18px 22px; font-size: 19px; box-shadow: 5px 5px 0 var(--gold); display: none; transition: transform .1s; }
.turn.show { display: inline-block; animation: rise .35s; }
@keyframes rise { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.turn:hover { transform: translate(-2px, -2px); }
.why { font-size: 14px; color: var(--ink2); text-align: right; margin-top: 8px; }

/* 지난 장 요약 */
.past { margin-top: 28px; }
.past h3 { font-family: var(--px); font-size: 11px; color: var(--gold); margin-bottom: 8px; font-weight: 400; }
.past ol { list-style: none; }
.past li { padding: 8px 0 8px 14px; border-left: 4px solid var(--blood); font-size: 16px; color: var(--ink2); cursor: pointer; margin-bottom: 4px; transition: background .12s, padding .12s; }
.past li:hover { background: rgba(163, 18, 43, .08); padding-left: 20px; }
.past li.empty { border-left-color: #cdb98c; color: #b9a37a; cursor: default; }
.past li.empty:hover { background: none; padding-left: 14px; }

.lesson { margin-top: 18px; padding: 12px 16px; background: rgba(0, 0, 0, .06); border-left: 6px solid var(--gold); font-size: 16px; display: none; }
.lesson.show { display: block; animation: rise .3s; }

.final h2 { font-family: var(--px); font-size: 18px; color: var(--blood); line-height: 1.7; margin-bottom: 10px; }
.final .rows { margin: 18px 0 8px; display: grid; gap: 10px; }
.final .rows p { font-size: 20px; line-height: 1.7; padding-left: 14px; border-left: 4px solid var(--blood); }

.seal-anim { position: fixed; inset: 0; display: none; place-items: center; z-index: 50; pointer-events: none; }
.seal-anim.show { display: grid; }
.seal-anim span { font-family: var(--px); font-size: 36px; color: var(--blood); border: 8px solid var(--blood); padding: 18px 24px; background: rgba(240, 224, 184, .92); transform: rotate(-10deg); animation: slam .9s ease-out forwards; }
@keyframes slam { 0% { transform: rotate(-10deg) scale(3); opacity: 0; } 25% { transform: rotate(-10deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(-10deg) scale(1); opacity: 0; } }

@media (max-width: 760px) {
  body { font-size: 17px; }
  .stage { grid-template-columns: 1fr; padding: 6px 12px 50px; }
  .tabs { flex-direction: row; padding: 0 0 8px; align-items: flex-end; gap: 4px; }
  .tab { width: auto; flex: 1; padding: 8px 2px; font-size: 11px; text-align: center; box-shadow: none; }
  .tab:hover:not(:disabled), .tab.on { width: auto; }
  .page { padding: 26px 20px 26px; }
  .title { font-size: 24px; } .contract { font-size: 21px; line-height: 2; }
  .ask { grid-template-columns: 1fr; } .face { display: none; } .bubble::before { display: none; }
  .foot { justify-content: center; } .why { text-align: center; }
  .bar { padding: 12px 16px; }
}
</style>
</head>
<body>

<div class="bar">
  <div><span class="brand">MONSTER STARTUP</span><span class="team" id="team"></span></div>
  <div class="right"><button class="reset" onclick="if(confirm('처음부터 다시 할까요? (지금까지 쓴 내용이 지워져요)')) Store.reset()">처음부터 다시</button></div>
</div>

<div class="stage">
  <nav class="tabs" id="tabs"></nav>
  <main id="book"></main>
</div>
<div class="seal-anim" id="sealAnim"><span>승인!</span></div>

<script src="quest-common.js"></script>
<script>
const st = Store.load();
document.getElementById('team').textContent = '· ' + st.team + '의 계약서';
let cur = Math.min(st.step || 1, 6), qi = 0;

function furthest() { let m = 1; for (let i = 1; i <= 6; i++) if (st.stamped[i]) m = Math.min(i + 1, 7); return m; }

function renderTabs() {
  const f = furthest();
  document.getElementById('tabs').innerHTML = QUESTS.map(q =>
    `<button class="tab ${st.stamped[q.n] ? 'done' : ''} ${q.n === cur ? 'on' : ''}" ${q.n > f ? 'disabled' : ''} onclick="go(${q.n})"><span class="n">${q.n}장</span>${q.name}</button>`).join('');
}

function pastList() {
  return QUESTS.filter(q => q.n !== cur).map(q => {
    const s = sentence(q, st);
    return s ? `<li onclick="go(${q.n})">${q.n}장 · ${s}</li>` : `<li class="empty">${q.n}장 · 아직 비어 있어요</li>`;
  }).join('');
}

function render(anim) {
  const book = document.getElementById('book');
  if (cur === 7) {
    book.innerHTML = `<article class="page final ${anim ? 'flip-in' : ''}">
      <div class="chap">THE END</div><h2>마왕님께 올리는<br>사악한 계획서</h2>
      <p class="mission">${st.team}의 최종 계약서가 완성됐어요! 6장이 이어져서 하나의 기획서가 되었죠.</p>
      <div class="rows">${QUESTS.map(q => `<p>${sentence(q, st) || ''}</p>`).join('')}</div>
      <div class="foot"><div class="saved ok"><span class="d"></span><b>자동 저장됨</b></div><div class="seals"><button class="back" onclick="go(6)">← 6장 다시 보기</button><button class="turn show" onclick="copyAll()">기획서 복사하기</button></div></div>
    </article>`;
    return;
  }
  const q = QUESTS[cur - 1];
  const a = st.answers[q.n] || '';
  const stamped = !!st.stamped[q.n];
  book.innerHTML = `<article class="page ${anim ? 'flip-in' : ''}" id="page">
    <div class="chap">CHAPTER 0${q.n} · ${q.key}</div>
    <h1 class="title">${q.n}장. ${q.name}</h1>
    <p class="mission">${q.mission}</p>

    <div class="ask">
      <div class="face">🤖</div>
      <div class="bubble"><span class="who">AIDEN의 질문 ${qi + 1}/${q.talk.length}</span><span id="qtext">${q.talk[qi]}</span>
        <div class="row"><span>조원끼리 1분만 이야기해 보세요.</span><button onclick="nextQ()">다음 질문 ▶</button></div>
      </div>
    </div>

    ${q.hasName ? `<div class="nameline">먼저 앱 이름은 「<span class="blank" id="nameIn" contenteditable="plaintext-only" data-ph="여기에 이름 쓰기" spellcheck="false">${st.name || ''}</span>」</div>` : ''}
    <p class="contract"><span class="fix">${q.before}</span>
      <span class="blank" id="ans" contenteditable="plaintext-only" data-ph="여기를 눌러 이어서 쓰세요" spellcheck="false">${a}</span>
      <span class="fix">${q.after}</span></p>
    <p class="hint">💡 ${q.hint}</p>

    <div class="slips-lab">붙임쪽지를 누르면 빈칸에 붙어요. 붙인 뒤에 고쳐 써도 돼요.</div>
    <div class="slips">${q.seeds.map((s, i) => `<button class="slip ${s === a ? 'used' : ''}" style="--r:${[-2, 1.5, -1, 2][i % 4]}deg" onclick="useSeed(${i})">${s}</button>`).join('')}</div>
    ${q.nameSeeds ? `<div class="slips-lab">이름 쪽지: ${q.nameSeeds.map((n, i) => `<button class="slip" style="--r:${[-1.5, 1, -1, 1.5][i]}deg;display:inline-block;margin:2px 6px 2px 0;padding:6px 10px" onclick="useName(${i})">${n}</button>`).join('')}</div>` : ''}
    <button class="dicebtn" onclick="roll()">🎲 더 사악한 아이디어 뽑기</button>

    <div class="lesson ${stamped ? 'show' : ''}" id="lesson"><b>[이번 장의 배움]</b> ${q.lesson}</div>

    <div class="foot">
      <div class="saved" id="saved"><span class="d"></span><span id="savedTxt"></span></div>
      <div>
        <div class="seals">
          ${q.n > 1 ? `<button class="back" onclick="go(${q.n - 1})">← 이전 장</button>` : ''}
          <button class="turn ${stamped ? 'show' : ''}" id="turnBtn" onclick="go(${q.n + 1})">${q.n === 6 ? '계약서 완성 보기' : '다음 장 넘기기 →'}</button>
          <button class="wax" id="wax" onclick="doStamp()" ${canStamp() ? '' : 'disabled'}>${stamped ? '승인<br>완료' : '마왕<br>도장'}</button>
        </div>
        <div class="why" id="why">${whyText()}</div>
      </div>
    </div>

    <div class="past"><h3>지난 장 · 눌러서 고칠 수 있어요</h3><ol id="past">${pastList()}</ol></div>
  </article>`;
  bind(); setSaved(!!st.at, false);
}

function whyText() { const q = QUESTS[cur - 1]; return canStamp() ? '도장을 찍어도 나중에 고칠 수 있어요.' : (q.hasName && !st.name ? '이름과 빈칸을 모두 채우면 도장을 찍을 수 있어요.' : '빈칸에 두 글자 이상 쓰면 도장을 찍을 수 있어요.'); }
function canStamp() { const q = QUESTS[cur - 1]; return (st.answers[q.n] || '').trim().length >= 2 && (!q.hasName || (st.name || '').trim().length >= 1); }

function bind() {
  const ans = document.getElementById('ans'), nm = document.getElementById('nameIn');
  ans.addEventListener('input', () => { st.answers[cur] = ans.textContent.replace(/\n/g, ' '); st.stamped[cur] = false; after(); });
  nm?.addEventListener('input', () => { st.name = nm.textContent.replace(/\n/g, ' '); after(); });
  [ans, nm].forEach(el => el?.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); }));
}
let saveT;
function after() {
  document.getElementById('turnBtn')?.classList.remove('show'); document.getElementById('lesson')?.classList.remove('show');
  const w = document.getElementById('wax'); w.disabled = !canStamp(); w.innerHTML = '마왕<br>도장';
  document.getElementById('why').textContent = whyText();
  document.getElementById('past').innerHTML = pastList(); renderTabs();
  setSaved(false, false);
  clearTimeout(saveT); saveT = setTimeout(() => setSaved(Store.save(), true), 350);
}
function setSaved(ok, pulse) {
  const el = document.getElementById('saved'); if (!el) return;
  el.className = 'saved ' + (ok ? 'ok' : '') + (pulse ? ' pulse' : '');
  document.getElementById('savedTxt').innerHTML = ok
    ? `<b>자동 저장됨</b> · ${agoText(st.at)}<br>이 컴퓨터의 이 브라우저에 저장돼요`
    : '쓰는 대로 자동 저장돼요';
}
function setText(id, v) { const e = document.getElementById(id); e.textContent = v; }
function useSeed(i) { st.answers[cur] = QUESTS[cur - 1].seeds[i]; st.stamped[cur] = false; Store.save(); render(); renderTabs(); document.getElementById('ans').focus(); }
function useName(i) { st.name = QUESTS[cur - 1].nameSeeds[i]; Store.save(); render(); renderTabs(); }
function roll() { st.answers[cur] = pick(QUESTS[cur - 1].dice); st.stamped[cur] = false; Store.save(); render(); renderTabs(); }
function nextQ() { const q = QUESTS[cur - 1]; qi = (qi + 1) % q.talk.length; document.querySelector('.bubble .who').textContent = `AIDEN의 질문 ${qi + 1}/${q.talk.length}`; setText('qtext', q.talk[qi]); }

function doStamp() {
  if (!canStamp()) return;
  st.stamped[cur] = true; st.step = Math.max(st.step || 1, cur + 1); Store.save();
  const s = document.getElementById('sealAnim'); s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 950);
  render(); renderTabs();
}
function go(n) {
  const p = document.getElementById('page');
  const swap = () => { cur = n; qi = 0; st.step = Math.max(st.step || 1, Math.min(n, 6)); renderTabs(); render(true); window.scrollTo({ top: 0 }); };
  if (p) { p.classList.add('flip-out'); setTimeout(swap, 300); } else swap();
}
function copyAll() { navigator.clipboard?.writeText(`[${st.team} 기획서]\n` + QUESTS.map(q => sentence(q, st)).filter(Boolean).join('\n')); }

renderTabs(); render(false);
</script>
</body>
</html>
