<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 결과 - 바이브코딩 스튜디오</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f7ff;
    --bg2: #eaf1ff;
    --surface: #ffffff;
    --surface2: #f3f6fd;
    --border: #dfe6f5;
    --text: #1b2340;
    --text-muted: #6b7690;
    --accent1: #3b82f6;
    --gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 45%, #22d3ee 100%);
    --shadow-card: 0 4px 18px rgba(30,64,175,0.07);
  }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 320px, var(--bg) 100%);
    color: var(--text);
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 6px; color: #10193a; }
  .sub { color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 14px; color: var(--accent1); }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
  }
  .empty { color: #9aa4c2; font-size: 0.9rem; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.85; }
  .btn-primary { background: #22c55e; color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
  .btn-cta {
    display: block;
    width: 100%;
    background: var(--gradient);
    color: #fff;
    font-size: 1.05rem;
    padding: 16px;
    margin-top: 10px;
    box-shadow: 0 10px 24px rgba(37,99,235,0.28);
  }
  .cta-row { display: flex; gap: 10px; margin-top: 10px; }
  .cta-row .btn-cta { flex: 1.4; margin-top: 0; }
  .btn-gemini {
    flex: 1;
    background: #fff;
    color: #1a73e8;
    border: 1.5px solid #1a73e8;
    font-size: 1.05rem;
    padding: 16px;
    white-space: nowrap;
  }
  .nav-back { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="nav-back" href="index.html">← 처음으로</a>
  <h1>📄 PRD 결과 확인</h1>
  <p class="sub">지금까지 만든 기획 내용을 확인하고, AI 코딩 프롬프트를 생성해 코드캔버스에서 바로 구현을 시작하세요.</p>

  <div class="card">
    <h2>기획 시뮬레이션 결과</h2>
    <pre id="sim-prd"></pre>
  </div>

  <div class="card">
    <h2>상세 기획서</h2>
    <pre id="planner-text"></pre>
  </div>

  <div class="card">
    <h2>🤖 AI 코딩 프롬프트</h2>
    <pre id="ai-prompt"></pre>
    <div class="btn-row">
      <button class="btn-secondary" onclick="copyPrompt()">📋 프롬프트 복사하기</button>
    </div>
  </div>

  <div class="cta-row">
    <button class="btn-gemini" onclick="goToGemini()">✨ Gemini로 이동하기</button>
    <button class="btn-cta" onclick="startInCodeCanvas()">🚀 CodeCanvas에서 시작하기</button>
  </div>

  <div class="card" id="submit-card" style="display:none;">
    <h2>📮 클래스에 제출하기</h2>
    <p class="empty" id="submit-desc">이 PRD를 우리 반 ClassLog 교실에 제출합니다.</p>
    <div class="btn-row">
      <button class="btn-primary" onclick="submitToClassLog()">제출하기</button>
    </div>
    <p class="empty" id="submit-status" style="margin-top:10px;"></p>
  </div>
</div>

<script src="shared/bridge.js"></script>
<script>
  const data = StudioBridge.load();
  StudioBridge.guard.init(); // ClassLog 입장 시 실수로 창 닫기 방지
  const simEl = document.getElementById('sim-prd');
  const planEl = document.getElementById('planner-text');
  const promptEl = document.getElementById('ai-prompt');

  simEl.textContent = data.simulationPRD || '';
  if (!data.simulationPRD) simEl.innerHTML = '<span class="empty">기획 시뮬레이션을 진행하지 않았습니다. (선택 단계)</span>';

  planEl.textContent = data.plannerText || '';
  if (!data.plannerText) planEl.innerHTML = '<span class="empty">아직 기획서가 작성되지 않았습니다. 2단계(기획하기)를 먼저 완료해주세요.</span>';

  const prompt = StudioBridge.buildCodePrompt(data);
  promptEl.textContent = prompt;

  // ClassLog 교실에서 진입한 경우(entryCode 있음)에만 제출 카드를 노출한다.
  const submitCard = document.getElementById('submit-card');
  const submitStatus = document.getElementById('submit-status');
  if (data.classlogEntryCode) {
    submitCard.style.display = 'block';
  }

  async function submitToClassLog() {
    const title = data.appName || (data.plannerData && data.plannerData.app_name1) || StudioBridge.defaultTitle(data);
    submitStatus.textContent = '제출 중...';
    try {
      await StudioBridge.submitResult({
        entryCode: data.classlogEntryCode,
        studentName: data.studentName,
        title: title,
        resultType: 'text',
        textContent: data.plannerText || data.simulationPRD || '',
      });
      StudioBridge.guard.markClean();
      submitStatus.textContent = '✅ 제출 완료! 선생님이 확인할 수 있어요.';
    } catch (e) {
      submitStatus.textContent = '❌ ' + e.message;
    }
  }

  function copyPrompt() {
    navigator.clipboard.writeText(promptEl.textContent).then(() => alert('프롬프트가 복사되었습니다!'));
  }

  function startInCodeCanvas() {
    const title = data.appName || (data.plannerData && data.plannerData.app_name1) || StudioBridge.defaultTitle(data);
    StudioBridge.sendToCodeCanvas(prompt, title);
  }

  function goToGemini() {
    window.open('https://gemini.google.com/app', '_blank');
  }
</script>
</body>
</html>
