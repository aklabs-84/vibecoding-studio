<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몬스터 스타트업 — 마왕의 계약서</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<script src="shared/bridge.js"></script>
<script src="shared/progress.js"></script>
<script>
  // ClassLog 입장 코드(?entryCode=...)가 주소에 있으면 먼저 기억하고, 실수로 창 닫기 방지를 켠다
  StudioBridge.captureEntryFromURL();
  StudioBridge.guard.init();
</script>
<style>
:root {
  --desk: #1a0b2a; --desk2: #2a0845; --paper: #f0e0b8; --paper2: #e3cd97; --ink: #2a1608; --ink2: #6b4a2b;
  --blood: #a3122b; --gold: #c9951c; --green: #00ff41; --light: #f4eeff;
  --px: 'Press Start 2P', monospace; --kr: 'Galmuri11', 'Galmuri9', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--desk); color: var(--light); font-family: var(--kr); font-size: 18px; line-height: 1.75; min-height: 100vh;
  background-image: radial-gradient(circle at 50% 0, #3a1260 0, transparent 60%); padding-bottom: 70px; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 맨 위 줄 */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 28px; }
.bar .brand { font-family: var(--px); font-size: 13px; color: var(--green); }
.bar .team { color: #b9a8d6; margin-left: 10px; }
.bar .right { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.linkbtn { background: none; border: none; color: #b9a8d6; text-decoration: underline; font-size: 14px; transition: color .15s; }
.linkbtn:hover { color: #ff6b81; }
a.linkbtn:hover { color: #fff; }
.bgm { background: var(--desk2); border: 3px solid #000; color: var(--green); font-size: 14px; padding: 4px 12px; box-shadow: 3px 3px 0 #000; transition: transform .1s, background .15s; }
.bgm:hover { background: #3d1568; transform: translate(-1px, -1px); }
.bgm.off { color: #b9a8d6; }

.screen { display: none; }
.screen.on { display: block; animation: rise .35s; }
@keyframes rise { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.wrap { max-width: 880px; margin: 0 auto; padding: 8px 16px 20px; }

/* 종이 한 장 (시작·이야기·교훈·결과) */
.sheet { background: var(--paper); color: var(--ink); border: 5px solid #000; box-shadow: 8px 8px 0 #000;
  background-image: repeating-linear-gradient(transparent 0 33px, rgba(107,74,43,.13) 33px 34px); padding: 30px 34px 34px; }
.eyebrow { font-family: var(--px); font-size: 11px; color: var(--blood); letter-spacing: 1px; }

/* 시작 */
.title h1 { font-size: 38px; line-height: 1.5; color: var(--ink); margin: 10px 0 6px; font-weight: normal; }
.title h1 b { color: var(--blood); font-weight: normal; }
.title .sub { color: var(--ink2); font-size: 19px; }
.cast { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 22px 0 10px; }
.cast img { height: 150px; max-width: 24vw; object-fit: contain; image-rendering: pixelated; mix-blend-mode: multiply; transition: transform .15s; }
.cast img:hover { transform: translateY(-8px); }
.resume { margin-top: 14px; padding: 14px 16px; border: 3px dashed var(--blood); font-size: 17px; }
.resume p { margin-bottom: 8px; color: var(--ink2); font-size: 15px; }
.sign { margin-top: 18px; font-size: 21px; }
.sign .line { display: inline-block; min-width: 260px; border-bottom: 3px solid var(--ink); padding: 0 8px; outline: none; color: var(--blood); font-size: 24px; }
.sign .line:empty::before { content: attr(data-ph); color: #b3a07a; }
.sign .line:focus { background: rgba(201,149,28,.18); }
.hintline { color: var(--ink2); font-size: 15px; margin-top: 8px; }
.warnline { color: var(--blood); font-size: 16px; margin-top: 6px; min-height: 26px; }
.go { display: flex; justify-content: flex-end; margin-top: 14px; align-items: center; gap: 18px; }

/* 도장 / 먹색 버튼 */
.wax { width: 108px; height: 108px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 30%, #d4283f 0, var(--blood) 55%, #6e0a1c 100%); color: #ffe4ea; font-size: 18px; line-height: 1.35; box-shadow: 0 6px 0 #4a0613, 0 0 0 4px #000; transition: transform .1s, box-shadow .1s, filter .2s; }
.wax:hover:not(:disabled) { transform: translateY(-3px) rotate(-4deg); box-shadow: 0 10px 0 #4a0613, 0 0 0 4px #000; }
.wax:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #4a0613, 0 0 0 4px #000; }
.wax:disabled { background: #b9a37a; color: #7c6a48; box-shadow: 0 0 0 4px #7c6a48; cursor: not-allowed; }
.btn { background: var(--ink); color: var(--paper); border: none; padding: 14px 24px; font-size: 19px; box-shadow: 5px 5px 0 var(--gold); transition: transform .1s; }
.btn:hover { transform: translate(-2px, -2px); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--gold); }
.ghost { background: none; border: none; color: var(--ink2); text-decoration: underline; font-size: 15px; transition: color .15s; }
.ghost:hover { color: var(--blood); }

/* 이야기 장면 */
.scene-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.dots { display: flex; gap: 7px; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border: 3px solid #000; background: #d9c699; }
.dots i.on { background: var(--blood); }
.dots i.past { background: var(--gold); }
.plate { background: var(--paper2); border: 4px solid #000; height: 300px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
.plate img { height: 94%; max-width: 100%; object-fit: contain; image-rendering: pixelated; mix-blend-mode: multiply; }
.plate .cap { position: absolute; left: 10px; top: 8px; font-family: var(--px); font-size: 10px; color: var(--ink2); }
.talk { margin-top: 18px; background: var(--ink); color: var(--paper); padding: 18px 24px 16px; box-shadow: 6px 6px 0 var(--gold); cursor: pointer; min-height: 126px; position: relative; transition: transform .1s; }
.talk:hover { transform: translate(-2px, -2px); }
.talk .who { font-family: var(--px); font-size: 11px; color: var(--gold); margin-bottom: 8px; }
.talk .txt { font-size: 22px; line-height: 1.65; min-height: 72px; word-break: keep-all; }
.talk .next { position: absolute; right: 18px; bottom: 10px; color: var(--green); font-size: 15px; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* 교훈 */
.lesson { text-align: center; }
.lesson .stamp { display: inline-block; font-family: var(--kr); font-size: 22px; color: var(--blood); border: 5px solid var(--blood); padding: 8px 18px; transform: rotate(-4deg); margin: 10px 0 22px; }
.lesson .done { color: var(--ink2); font-size: 17px; }
.lesson .done b { color: var(--ink); font-weight: normal; }
.lesson .quote { margin: 18px auto; max-width: 600px; font-size: 24px; line-height: 1.6; color: var(--ink); word-break: keep-all; }
.lesson .who { font-family: var(--px); font-size: 11px; color: var(--ink2); }
.lesson .go { justify-content: center; margin-top: 24px; }

/* 책 (입력 화면) */
.stage { display: grid; grid-template-columns: 86px minmax(0, 820px); justify-content: center; padding: 10px 20px 20px; }
.tabs { display: flex; flex-direction: column; gap: 6px; padding-top: 34px; align-items: flex-end; }
.tab { width: 70px; word-break: keep-all; border: none; border-radius: 0; background: var(--desk2); color: #b9a8d6; padding: 12px 6px 12px 10px; text-align: left; font-size: 14px; line-height: 1.3; box-shadow: -4px 0 0 #000 inset; transition: background .15s, color .15s; }
.tab .n { font-family: var(--px); font-size: 12px; display: block; margin-bottom: 2px; }
.tab:hover:not(:disabled):not(.on) { background: #3d1568; color: #fff; box-shadow: -4px 0 0 #000 inset, inset 0 -3px 0 var(--blood); }
.tab:disabled { opacity: .3; cursor: not-allowed; }
.tab.done { background: var(--blood); color: #ffe4ea; }
.tab.done:hover:not(:disabled):not(.on) { background: #b3203f; }
.tab.done .n::after { content: ' ✓'; }
.tab.on { width: 82px; background: var(--paper); color: var(--ink); box-shadow: none; }
.tab.on .n { color: var(--blood); }

.page { background: var(--paper); color: var(--ink); padding: 40px 54px 36px; position: relative; box-shadow: 0 0 0 4px #000, 10px 10px 0 4px #000, inset 0 0 0 4px var(--paper2);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(107, 74, 43, .08) 31px 32px); }
.page.flip-out { animation: flipOut .3s ease-in forwards; }
.page.flip-in { animation: flipIn .4s ease-out; }
@keyframes flipOut { to { transform: translateX(-40px) rotate(-2deg); opacity: 0; } }
@keyframes flipIn { from { transform: translateX(40px) rotate(2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.chap { font-family: var(--px); font-size: 12px; color: var(--blood); margin-bottom: 10px; }
.page .qtitle { font-size: 30px; line-height: 1.4; margin-bottom: 8px; font-weight: normal; }
.mission { color: var(--ink2); font-size: 18px; margin-bottom: 26px; }

.ask { display: grid; grid-template-columns: 62px 1fr; gap: 16px; align-items: start; margin-bottom: 30px; }
.face { width: 62px; height: 62px; background: var(--desk2); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 28px; }
.bubble { background: #fff8e4; border: 3px solid var(--ink); padding: 14px 18px; position: relative; font-size: 19px; line-height: 1.6; }
.bubble::before { content: ''; position: absolute; left: -13px; top: 18px; border: 8px solid transparent; border-right-color: var(--ink); }
.bubble .who { font-family: var(--px); font-size: 10px; color: var(--blood); display: block; margin-bottom: 4px; }
.bubble .row { display: flex; gap: 14px; margin-top: 10px; align-items: center; font-size: 15px; color: var(--ink2); flex-wrap: wrap; }
.bubble .row button { background: none; border: none; border-bottom: 2px solid var(--blood); color: var(--blood); font-size: 15px; padding: 0; transition: transform .1s; }
.bubble .row button:hover { transform: translateY(-2px); }

.contract { font-size: 26px; line-height: 2.1; margin-bottom: 8px; }
.blank { display: inline; min-width: 6ch; border-bottom: 4px dotted var(--blood); padding: 0 6px 2px; outline: none; color: var(--blood); background: rgba(163, 18, 43, .06); transition: background .15s; word-break: keep-all; }
.blank:focus { background: rgba(163, 18, 43, .14); border-bottom-style: solid; }
.blank:empty::before { content: attr(data-ph); color: #b9936a; }
.nameline { font-size: 18px; margin-bottom: 8px; color: var(--ink2); }
.nameline .blank { font-size: 24px; }
.hint { font-size: 16px; color: var(--ink2); margin-bottom: 22px; }

.slips-lab { font-size: 16px; color: var(--ink2); margin-bottom: 8px; }
.slips { display: flex; flex-wrap: wrap; gap: 14px 12px; margin-bottom: 14px; padding: 6px 4px 14px; }
.slip { background: #fff3a8; border: none; color: var(--ink); padding: 12px 14px; max-width: 250px; text-align: left; font-size: 15px; line-height: 1.5; box-shadow: 4px 4px 0 rgba(0, 0, 0, .35); transform: rotate(var(--r)); transition: transform .15s, box-shadow .15s; }
.slip:nth-child(2n) { background: #ffd6c9; } .slip:nth-child(3n) { background: #d4f0c0; }
.slip:hover { transform: rotate(0) translateY(-6px); box-shadow: 6px 10px 0 rgba(0, 0, 0, .35); }
.slip.used { outline: 3px solid var(--blood); }
.nameslips { margin-bottom: 14px; }
.nameslips .slip { display: inline-block; margin: 2px 6px 2px 0; padding: 6px 10px; }
.dicebtn { background: none; border: 3px dashed var(--blood); color: var(--blood); padding: 8px 16px; font-size: 16px; transition: background .15s, color .15s; }
.dicebtn:hover { background: var(--blood); color: #fff; }

.foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 30px; padding-top: 22px; border-top: 3px double var(--ink2); flex-wrap: wrap; }
.saved { font-size: 15px; color: var(--ink2); line-height: 1.6; }
.saved b { font-weight: 400; color: #1d7a2e; }
.saved .d { display: inline-block; width: 10px; height: 10px; background: #bbb; margin-right: 8px; }
.saved.ok .d { background: #1d7a2e; }
.saved.pulse .d { animation: flash .6s; }
.saved.bad { color: var(--blood); }
.saved.bad .d { background: var(--blood); }
@keyframes flash { 0%, 60% { opacity: .15; } 100% { opacity: 1; } }
.seals { display: flex; gap: 18px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.back { background: none; border: none; color: var(--ink2); text-decoration: underline; font-size: 15px; }
.back:hover { color: var(--ink); }
.turn { background: var(--ink); color: var(--paper); border: none; padding: 18px 22px; font-size: 19px; box-shadow: 5px 5px 0 var(--gold); display: none; transition: transform .1s; }
.turn.show { display: inline-block; animation: rise .35s; }
.turn:hover { transform: translate(-2px, -2px); }
.why { font-size: 14px; color: var(--ink2); text-align: right; margin-top: 8px; }

.past { margin-top: 28px; }
.past h3 { font-family: var(--px); font-size: 11px; color: var(--gold); margin-bottom: 8px; font-weight: 400; }
.past ol { list-style: none; }
.past li { padding: 8px 0 8px 14px; border-left: 4px solid var(--blood); font-size: 16px; color: var(--ink2); cursor: pointer; margin-bottom: 4px; transition: background .12s, padding .12s; }
.past li:hover { background: rgba(163, 18, 43, .08); padding-left: 20px; }
.past li.empty { border-left-color: #cdb98c; color: #b9a37a; cursor: default; }
.past li.empty:hover { background: none; padding-left: 14px; }

.seal-anim { position: fixed; inset: 0; display: none; place-items: center; z-index: 50; pointer-events: none; }
.seal-anim.show { display: grid; }
.seal-anim span { font-family: var(--kr); font-size: 40px; color: var(--blood); border: 8px solid var(--blood); padding: 14px 26px; background: rgba(240, 224, 184, .92); animation: slam .9s ease-out forwards; }
@keyframes slam { 0% { transform: rotate(-10deg) scale(1.8); opacity: 0; } 25% { transform: rotate(-10deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(-10deg) scale(1); opacity: 0; } }

/* 결과 */
.res h2 { font-size: 28px; margin: 10px 0 4px; line-height: 1.6; font-weight: normal; }
.score { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 18px; flex-wrap: wrap; }
.score .num { font-family: var(--px); font-size: 40px; color: var(--blood); }
.score .lab { color: var(--ink2); font-size: 16px; }
.plan { list-style: none; border-top: 3px solid var(--ink); }
.plan li { padding: 11px 0 11px 14px; border-bottom: 1px dashed var(--ink2); font-size: 18px; line-height: 1.6; transition: background .12s, padding .12s; word-break: keep-all; }
.plan li:hover { background: rgba(163,18,43,.08); padding-left: 20px; }
.plan li .n { font-family: var(--px); font-size: 11px; color: var(--blood); display: block; }
.out { margin-top: 26px; border-top: 3px solid var(--ink); padding-top: 16px; }
.out-h { font-size: 22px; color: var(--ink); }
.orow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--ink2); }
.orow .ot { flex: 1; min-width: 0; }
.orow .ot b { display: block; font-size: 19px; color: var(--ink); font-weight: normal; }
.orow .ot span { font-size: 15px; color: var(--ink2); }
.pv { display: none; margin-top: 14px; background: var(--ink); color: var(--paper); padding: 16px 18px; font-family: var(--kr); font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; box-shadow: 5px 5px 0 var(--gold); }
.pv.on { display: block; }
.toast { color: var(--blood); font-size: 16px; margin-top: 10px; min-height: 26px; }
details.learn { margin-top: 22px; border-top: 3px solid var(--ink); padding-top: 12px; }
details.learn summary { cursor: pointer; font-size: 19px; color: var(--ink); transition: color .15s; }
details.learn summary:hover { color: var(--blood); }
details.learn ol { margin: 10px 0 0 22px; font-size: 16px; color: var(--ink2); }
.sg-steps { margin: 12px 0 8px; padding-left: 26px; font-size: 17px; line-height: 1.7; color: var(--ink); }
.sg-steps li { margin-bottom: 8px; }
.submit-guide { background: #fff8e4; border: 3px solid var(--ink); padding: 16px 18px; }
.res .go { justify-content: space-between; }

@media (max-width: 760px) {
  body { font-size: 17px; }
  .bar { padding: 12px 16px; }
  .stage { grid-template-columns: 1fr; padding: 6px 12px 20px; }
  .tabs { flex-direction: row; padding: 0 0 8px; align-items: flex-end; gap: 4px; }
  .tab { width: auto; flex: 1; padding: 8px 2px; font-size: 11px; text-align: center; box-shadow: none; }
  .tab .n { font-size: 10px; }
  .tab:hover:not(:disabled), .tab.on { width: auto; }
  .page { padding: 26px 20px 26px; }
  .page .qtitle { font-size: 24px; } .contract { font-size: 21px; line-height: 2; }
  .ask { grid-template-columns: 1fr; } .face { display: none; } .bubble::before { display: none; }
  .foot { justify-content: center; } .why { text-align: center; }
}
@media (max-width: 600px) {
  .sheet { padding: 20px 16px 24px; }
  .title h1 { font-size: 28px; }
  .cast img { height: 90px; }
  .plate { height: 200px; }
  .talk .txt { font-size: 19px; }
  .sign .line { min-width: 0; width: 100%; }
  .wax { width: 92px; height: 92px; font-size: 16px; }
  .orow { flex-wrap: wrap; }
  .orow .ot { flex-basis: 100%; }
  .res h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<audio id="bgm" src="assets/Sunrise_at_the_Castle_Gate.mp3" loop preload="none"></audio>

<div class="bar">
  <div><span class="brand">MONSTER STARTUP</span><span class="team" id="barTeam"></span></div>
  <div class="right">
    <a class="linkbtn" href="index.html">← 처음 화면</a>
    <button class="bgm off" id="bgmBtn" type="button" onclick="toggleBgm()">♪ 배경음악 켜기</button>
    <button class="linkbtn" type="button" onclick="resetAll()">처음부터 다시</button>
  </div>
</div>

<!-- ① 시작 -->
<section class="screen on" id="s-title">
  <div class="wrap"><div class="sheet title">
    <div class="eyebrow">MONSTER STARTUP</div>
    <h1>마왕군 <b>기획 계약서</b></h1>
    <div class="sub">사악한 천재 기획팀이여, 먼저 부대 이름을 서명하라!</div>
    <div class="cast">
      <img src="assets/orc_pixel_member_1777946394304.png" alt="">
      <img src="assets/angry_overlord_pixel_1777947150969.png" alt="" style="height:190px">
      <img src="assets/monster_ai_secretary_1777946372077.png" alt="">
      <img src="assets/skeleton_pixel_member_1777946415693.png" alt="">
    </div>
    <div class="resume" id="resume" style="display:none">
      <p id="resumeTxt"></p>
      <button class="btn" type="button" onclick="resumeGame()">이어서 하기 →</button>
    </div>
    <div class="sign">부대 이름: <span class="line" id="teamIn" data-ph="여기에 서명" spellcheck="false"></span></div>
    <div class="hintline">조원들과 상의해서 가장 무서운(또는 웃긴) 이름을 정해 보세요. 예: 마왕군 특공대</div>
    <div class="warnline" id="teamWarn" role="alert"></div>
    <div class="go"><button class="wax" id="startBtn" type="button" onclick="startNew()">계약<br>시작!</button></div>
  </div></div>
</section>

<!-- ② 이야기 -->
<section class="screen" id="s-scene">
  <div class="wrap"><div class="sheet">
    <div class="scene-top">
      <div class="dots" id="dots"></div>
      <button class="ghost" type="button" onclick="skipScene()">이야기 건너뛰기 ▶▶</button>
    </div>
    <div class="plate"><span class="cap" id="cap"></span><img id="pimg" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"></div>
    <div class="talk" id="talk" role="button" tabindex="0" onclick="nextLine()">
      <div class="who">AIDEN (마왕군 AI 비서)</div>
      <div class="txt" id="txt" aria-live="polite"></div>
      <div class="next" id="nx">▶ 눌러서 다음</div>
    </div>
  </div></div>
</section>

<!-- ③ 입력 책 -->
<section class="screen" id="s-book">
  <div class="stage">
    <nav class="tabs" id="tabs" aria-label="장 목록"></nav>
    <main id="book"></main>
  </div>
</section>

<!-- ④ 교훈 -->
<section class="screen" id="s-lesson">
  <div class="wrap"><div class="sheet lesson" id="lessonBox"></div></div>
</section>

<!-- ⑤ 결과 -->
<section class="screen" id="s-result">
  <div class="wrap"><div class="sheet res" id="resultBox"></div></div>
</section>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clean = s => String(s || '').replace(/\s+/g, ' ').slice(0, 200);
const PLAIN = (() => { const d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; } catch (e) {} return d.contentEditable === 'plaintext-only'; })();
const CE = PLAIN ? 'plaintext-only' : 'true';
function agoText(t) { if (!t) return '아직 저장 전'; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 5 ? '방금 전' : s < 60 ? s + '초 전' : Math.floor(s / 60) + '분 전'; }
function plainPaste(e) { e.preventDefault(); const t = clean((e.clipboardData || window.clipboardData).getData('text')); document.execCommand('insertText', false, t); }
function editable(el, onInput) {
  if (!el) return;
  el.addEventListener('input', () => onInput(clean(el.textContent)));
  el.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  el.addEventListener('paste', plainPaste);
}

/* ===== 저장 (이 브라우저, 입장번호+학생이름별) ===== */
const ctx = (window.StudioBridge && StudioBridge.load()) || {};
const KEY = 'vcs_sim_v2:' + (ctx.classlogEntryCode || 'solo') + ':' + (ctx.studentName || '');
const fresh = () => ({ v: 2, team: '', answers: {}, name: '', stamped: {}, seen: {}, cur: 1, started: false, at: 0 });
let st = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const d = JSON.parse(raw); if (d && d.v === 2) st = Object.assign(fresh(), d, { answers: d.answers || {}, stamped: d.stamped || {}, seen: d.seen || {} }); }
} catch (e) {}
let storageOk = true;
function saveDraft() { st.at = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(st)); storageOk = true; } catch (e) { storageOk = false; } return storageOk; }

const stampedCount = () => QUESTS.filter(q => st.stamped[q.n]).length;
const allStamped = () => stampedCount() === 6;
function unlocked() { let m = 1; QUESTS.forEach(q => { if (st.stamped[q.n]) m = Math.max(m, Math.min(q.n + 1, 6)); }); return Math.max(m, st.cur); }
function sentence(q) {
  const a = st.answers[q.n]; if (!a) return '';
  return q.hasName && st.name ? `${q.before} 「${st.name}」 — ${a} ${q.after}` : `${q.before} ${a} ${q.after}`;
}

/* ===== 배경음악 ===== */
function setBgmUI(on) { const b = $('bgmBtn'); b.classList.toggle('off', !on); b.textContent = on ? '♪ 배경음악 끄기' : '♪ 배경음악 켜기'; }
function playBgm() { const a = $('bgm'); a.volume = .5; const p = a.play(); if (p && p.then) p.then(() => setBgmUI(true), () => setBgmUI(false)); }
function toggleBgm() { const a = $('bgm'); if (a.paused) playBgm(); else { a.pause(); setBgmUI(false); } }

/* ===== 화면 전환 ===== */
function show(id) {
  document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === 's-' + id));
  if (id !== 'scene') clearTimeout(typeTimer);
  window.scrollTo({ top: 0 });
  reportProgress(id);
}
// 선생님 화면에 "지금 여기 있어요"를 알린다. (실패해도 화면 동작에는 영향 없음)
function reportProgress(id) {
  try {
    if (!window.StudioProgress) return;
    const n = Number(st && st.cur) || 0, q = n >= 1 && QUESTS[n - 1] ? QUESTS[n - 1].name : '';
    let no = 1, label = '부대 이름 정하기';
    if (id === 'scene') { no = n ? n + 1 : 1; label = n ? `${n}장 이야기 보는 중` : '이야기 보는 중'; }
    else if (id === 'book') { no = n + 1; label = `${n}장 ${q}`; }
    else if (id === 'lesson') { no = n + 1; label = `${n}장 승인 완료`; }
    else if (id === 'result') { no = 8; label = '계약 완성'; }
    StudioProgress.report({ page: 2, pageLabel: '몬스터 스타트업', stepNo: no, stepTotal: 8, stepLabel: label });
    if (id === 'result') StudioProgress.complete(2);
  } catch (e) {}
}
function updateBarTeam() { $('barTeam').textContent = st.team ? '· ' + st.team + '의 계약서' : ''; }

/* ===== ① 시작 ===== */
function initTitle() {
  const t = $('teamIn');
  t.setAttribute('contenteditable', CE);
  t.textContent = st.team || '';
  // 아이스브레이킹에서 정한 팀 이름이 있으면 부대 이름 칸에 미리 채워 준다 (이미 쓴 이름이 있으면 그대로 둔다)
  if (!st.team && !st.started) {
    try { const ice = window.StudioBridge && StudioBridge.load().iceTeamName; if (ice) { t.textContent = ice; st.team = ice; } } catch (e) {}
  }
  editable(t, v => { st.team = v; $('teamWarn').textContent = ''; });
  t.addEventListener('keydown', e => { if (e.key === 'Enter') startNew(); });
  if (st.started) {
    const n = stampedCount();
    $('resumeTxt').textContent = `저장된 계약서가 있어요. 「${st.team || '이름 없는 부대'}」 · ${n}장 도장 완료. 이어서 하면 지난번 그 자리로 가요.`;
    $('resume').style.display = 'block';
  }
  updateBarTeam();
}
function startNew() {
  const name = clean($('teamIn').textContent).trim();
  if (!name) { $('teamWarn').textContent = '부대 이름을 먼저 서명해 주세요. 줄을 누르고 이름을 쓰면 돼요.'; $('teamIn').focus(); return; }
  if (st.started && !confirm('저장된 계약서가 지워지고 새로 시작해요. 괜찮아요?')) return;

/* ===== ② 이야기 ===== */
let list = [], idx = 0, typeTimer = null, typing = false, sceneDone = null, finished = false;
function sceneList(n, kind) { const q = QUESTS[n - 1]; return q[kind].map(s => ({ cap: 'QUEST 0' + n, img: s.img, text: s.text })); }
function playScenes(l, done) { list = l; idx = 0; sceneDone = done; finished = false; show('scene'); draw(); $('talk').focus({ preventScroll: true }); }
function finishScenes() { if (finished) return; finished = true; clearTimeout(typeTimer); const d = sceneDone; sceneDone = null; if (d) d(); }
function skipScene() { finishScenes(); }

    else { typing = false; $('nx').style.visibility = 'visible'; $('nx').textContent = idx === list.length - 1 ? '▶ 눌러서 계속' : '▶ 눌러서 다음'; }
  })();
}
function nextLine() {

function copyIt(kind) {
  copyText(buildPrompt(kind)).then(
    () => msg(kind === 'img' ? '복사됐어요! 그림 만들기 AI에 붙여넣기 하세요' : '복사됐어요! AI 대화창에 붙여넣기 하세요'),
    () => { previewIt(kind); msg('자동 복사가 막혔어요. 아래 상자의 글을 드래그해서 복사해 주세요'); });
}

/* ===== 처음부터 다시 ===== */
function resetAll() {
  if (!confirm('처음부터 다시 할까요? (지금까지 쓴 내용이 지워져요)')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  if (window.StudioBridge) StudioBridge.guard.allowLeave();
  location.reload();
}

initTitle();
</script>
